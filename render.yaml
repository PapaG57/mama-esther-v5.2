services:
  - type: web
    name: mama-esther-backend
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    rootDir: backend-newsletter
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: POSTGRES_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_SENDER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: FRONT_URL
        value: https://www.mamaesther.org
